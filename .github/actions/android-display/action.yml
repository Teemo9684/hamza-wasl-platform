    - name: Configure System Bars Theme v35+ (Android 15)
      shell: bash
      run: |
        mkdir -p "android/app/src/main/res/values-v35"
        cat > "android/app/src/main/res/values-v35/styles.xml" << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:colorPrimary">#FFFFFF</item>
                <item name="android:colorPrimaryDark">#FFFFFF</item>
                <item name="android:colorAccent">#3b82f6</item>
                <item name="android:statusBarColor">#FFFFFF</item>
                <item name="android:navigationBarColor">#FFFFFF</item>
                <item name="android:windowBackground">#FFFFFF</item>
                <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                <item name="android:windowLightStatusBar">true</item>
                <item name="android:windowLightNavigationBar">true</item>
                <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>
            </style>
            <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:colorPrimary">#FFFFFF</item>
                <item name="android:colorPrimaryDark">#FFFFFF</item>
                <item name="android:colorAccent">#3b82f6</item>
                <item name="android:statusBarColor">#FFFFFF</item>
                <item name="android:navigationBarColor">#FFFFFF</item>
                <item name="android:windowBackground">#FFFFFF</item>
                <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                <item name="android:windowLightStatusBar">true</item>
                <item name="android:windowLightNavigationBar">true</item>
                <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>
            </style>
            <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                <item name="windowSplashScreenBackground">#FFFFFF</item>
                <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
                <item name="android:windowBackground">#FFFFFF</item>
            </style>
        </resources>
        EOF
        echo "✅ values-v35/styles.xml created"

    - name: Fix WebView Display Size and System Bars
      env:
        APP_PACKAGE: ${{ inputs.app-package }}
      shell: bash
      run: |
        MAIN_ACTIVITY_DIR="android/app/src/main/java/${APP_PACKAGE//.//}"
        mkdir -p "$MAIN_ACTIVITY_DIR"

        cat > "$MAIN_ACTIVITY_DIR/MainActivity.java" << 'EOF'
        package app.hamzawasl.app;

        import android.graphics.Color;
        import android.os.Build;
        import android.os.Bundle;
        import android.view.View;
        import android.view.Window;
        import android.view.WindowManager;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import androidx.core.view.ViewCompat;
        import androidx.core.view.WindowCompat;
        import androidx.core.view.WindowInsetsCompat;
        import androidx.core.view.WindowInsetsControllerCompat;
        import androidx.core.splashscreen.SplashScreen;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    SplashScreen splashScreen = SplashScreen.installSplashScreen(this);
                    splashScreen.setKeepOnScreenCondition(() -> false);
                }

                enableEdgeToEdge();
                super.onCreate(savedInstanceState);
                configureSystemBars();
                configureWebView();
            }

            private void enableEdgeToEdge() {
                Window window = getWindow();
                WindowCompat.setDecorFitsSystemWindows(window, true);
            }

            private void configureSystemBars() {
                Window window = getWindow();
                WindowCompat.setDecorFitsSystemWindows(window, true);
                window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                window.setStatusBarColor(Color.WHITE);
                window.setNavigationBarColor(Color.WHITE);

                View decorView = window.getDecorView();
                WindowInsetsControllerCompat insetsController = WindowCompat.getInsetsController(window, decorView);

                if (insetsController != null) {
                    insetsController.setAppearanceLightStatusBars(true);
                    insetsController.setAppearanceLightNavigationBars(true);
                }

                if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                    int flags = decorView.getSystemUiVisibility();
                    flags &= ~View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN;
                    flags &= ~View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION;
                    flags |= View.SYSTEM_UI_FLAG_LAYOUT_STABLE;
                    flags |= View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        flags |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                    }
                    decorView.setSystemUiVisibility(flags);
                }
            }

            private void configureWebView() {
                WebView webView = getBridge().getWebView();
                if (webView != null) {
                    WebSettings webSettings = webView.getSettings();
                    webView.setBackgroundColor(Color.WHITE);
                    webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                    webSettings.setUseWideViewPort(true);
                    webSettings.setLoadWithOverviewMode(true);
                    webSettings.setTextZoom(100);
                    webSettings.setBuiltInZoomControls(false);
                    webSettings.setDisplayZoomControls(false);
                    webSettings.setSupportZoom(false);
                    webView.setInitialScale(0);
                }
                getWindow().getDecorView().setBackgroundColor(Color.WHITE);
            }

            @Override
            public void onResume() {
                super.onResume();
                configureSystemBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
                super.onWindowFocusChanged(hasFocus);
                if (hasFocus) {
                    configureSystemBars();
                }
            }
        }
        EOF
        sed -i "s/^package app.hamzawasl.app;/package ${APP_PACKAGE};/" "$MAIN_ACTIVITY_DIR/MainActivity.java"
        echo "✅ Custom MainActivity.java created with WebView fixes"
