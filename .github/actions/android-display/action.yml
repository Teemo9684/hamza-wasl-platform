name: Configure Android display
description: Apply shared WebView and system bar settings
inputs:
  app-package:
    description: Java package of the Capacitor activity
    required: true
runs:
  using: composite
  steps:
    - name: Configure System Bars Theme
      shell: bash
      run: |
        STYLES_FILE="android/app/src/main/res/values/styles.xml"
        cat > "$STYLES_FILE" << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:colorPrimary">#FFFFFF</item>
                <item name="android:colorPrimaryDark">#FFFFFF</item>
                <item name="android:colorAccent">#3b82f6</item>
                <item name="android:statusBarColor">#FFFFFF</item>
                <item name="android:navigationBarColor">#FFFFFF</item>
                <item name="android:windowBackground">#FFFFFF</item>
                <item name="android:windowLightStatusBar">true</item>
                <item name="android:windowDrawsSystemBarBackgrounds">true</item>
            </style>
            <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:colorPrimary">#FFFFFF</item>
                <item name="android:colorPrimaryDark">#FFFFFF</item>
                <item name="android:colorAccent">#3b82f6</item>
                <item name="android:statusBarColor">#FFFFFF</item>
                <item name="android:navigationBarColor">#FFFFFF</item>
                <item name="android:windowBackground">#FFFFFF</item>
                <item name="android:windowLightStatusBar">true</item>
                <item name="android:windowDrawsSystemBarBackgrounds">true</item>
            </style>
            <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                <item name="windowSplashScreenBackground">#FFFFFF</item>
                <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
                <item name="android:windowBackground">#FFFFFF</item>
            </style>
        </resources>
        EOF
        echo "✅ styles.xml updated with white background"

    - name: Configure System Bars Theme v27+
      shell: bash
      run: |
        mkdir -p "android/app/src/main/res/values-v27"
        cat > "android/app/src/main/res/values-v27/styles.xml" << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:colorPrimary">#FFFFFF</item>
                <item name="android:colorPrimaryDark">#FFFFFF</item>
                <item name="android:colorAccent">#3b82f6</item>
                <item name="android:statusBarColor">#FFFFFF</item>
                <item name="android:navigationBarColor">#FFFFFF</item>
                <item name="android:windowBackground">#FFFFFF</item>
                <item name="android:windowLightStatusBar">true</item>
                <item name="android:windowLightNavigationBar">true</item>
                <item name="android:windowDrawsSystemBarBackgrounds">true</item>
            </style>
            <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:colorPrimary">#FFFFFF</item>
                <item name="android:colorPrimaryDark">#FFFFFF</item>
                <item name="android:colorAccent">#3b82f6</item>
                <item name="android:statusBarColor">#FFFFFF</item>
                <item name="android:navigationBarColor">#FFFFFF</item>
                <item name="android:windowBackground">#FFFFFF</item>
                <item name="android:windowLightStatusBar">true</item>
                <item name="android:windowLightNavigationBar">true</item>
                <item name="android:windowDrawsSystemBarBackgrounds">true</item>
            </style>
            <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                <item name="windowSplashScreenBackground">#FFFFFF</item>
                <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
                <item name="android:windowBackground">#FFFFFF</item>
            </style>
        </resources>
        EOF
        echo "✅ values-v27/styles.xml created"

    - name: Configure System Bars Theme v31+ (Android 12)
      shell: bash
      run: |
        mkdir -p "android/app/src/main/res/values-v31"
        cat > "android/app/src/main/res/values-v31/styles.xml" << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:colorPrimary">#FFFFFF</item>
                <item name="android:colorPrimaryDark">#FFFFFF</item>
                <item name="android:colorAccent">#3b82f6</item>
                <item name="android:statusBarColor">#FFFFFF</item>
                <item name="android:navigationBarColor">#FFFFFF</item>
                <item name="android:windowBackground">#FFFFFF</item>
                <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                <item name="android:windowLightStatusBar">true</item>
                <item name="android:windowLightNavigationBar">true</item>
            </style>
            <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:colorPrimary">#FFFFFF</item>
                <item name="android:colorPrimaryDark">#FFFFFF</item>
                <item name="android:colorAccent">#3b82f6</item>
                <item name="android:statusBarColor">#FFFFFF</item>
                <item name="android:navigationBarColor">#FFFFFF</item>
                <item name="android:windowBackground">#FFFFFF</item>
                <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                <item name="android:windowLightStatusBar">true</item>
