name: Parents preview build

on:
  push:
    branches:
      - 'apps/parents-preview'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parents-web:
    name: Verify parent-only bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build parent-only frontend
        run: npm run build:parent
      - name: Verify separated manifest and output
        run: |
          test -f dist-parent/index.html
          node scripts/verify-parents-build.mjs
      - name: Upload verification artifact (not an OTA release)
        uses: actions/upload-artifact@v4
        with:
          name: parents-preview-web
          path: dist-parent/
          retention-days: 7

  parents-android:
    name: Build independent Android debug package
    needs: parents-web
    runs-on: ubuntu-latest
    env:
      APP_AUDIENCE: parent
      PARENT_OTA_ENABLED: 'false'
      VITE_PARENT_OTA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Build parent-only assets
        run: npm run build:parent
      - name: Generate isolated Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Verify Android identity and disabled OTA
        run: |
          grep -q 'app.hamzawasl.parents' android/app/build.gradle
          grep -q "enabled: audience === 'combined' ||" capacitor.config.ts
          test "${PARENT_OTA_ENABLED}" = 'false'
          test "${VITE_PARENT_OTA_ENABLED}" = 'false'
      - name: Build debug APK (testing only)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK package identity
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -q "package: name='app.hamzawasl.parents'"
          sha256sum "$APK" | tee parents-debug-sha256.txt
      - name: Upload test APK (not a release)
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: parents-preview-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            parents-debug-sha256.txt
          if-no-files-found: error
          retention-days: 7
      - name: Link verified test artifact
        env:
          ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
        run: |
          {
            echo '### همزة وصل – نسخة الأولياء Android (اختبار فقط)'
            echo ''
            echo 'Package: `app.hamzawasl.parents`'
            echo ''
            echo "Debug APK and SHA-256: [GitHub Actions artifact](${ARTIFACT_URL})"
            echo ''
            echo 'هذه ليست نسخة إنتاجية، والتحديث التلقائي معطّل.'
          } >> "$GITHUB_STEP_SUMMARY"

# No production deployment, no live updates, and no release publication.
# Android debug APKs are test artifacts, not installs for school users.
