name: Parents preview build

on:
  push:
    branches:
      - 'apps/parents-preview'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parents-web:
    name: Verify parent-only bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply parents PWA icon if uploaded
        run: node scripts/apply-parents-icon.mjs web
      - name: Build parent-only frontend
        run: npm run build:parent
      - name: Verify separated manifest and output
        run: |
          test -f dist-parent/index.html
          node scripts/verify-parents-build.mjs
      - name: Upload verification artifact (not an OTA release)
        uses: actions/upload-artifact@v4
        with:
          name: parents-preview-web
          path: dist-parent/
          retention-days: 7

  parents-android:
    name: Build independent Android debug package
    needs: parents-web
    runs-on: ubuntu-latest
    env:
      APP_AUDIENCE: parent
      PARENT_OTA_ENABLED: 'true'
      VITE_PARENT_OTA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK (hosted or verified fallback)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Hosted Android SDK directory: $SDK"
          java -version
          if [[ -d "$SDK" ]]; then
            find "$SDK/cmdline-tools" -maxdepth 4 -name sdkmanager -type f -print 2>/dev/null || true
          fi
          SDKMANAGER=""
          if [[ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 4 -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android command-line tools not found: installing official checksum-verified tools"
            SDK="$RUNNER_TEMP/parents-android-sdk"
            mkdir -p "$SDK/cmdline-tools/latest"
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/android-tools.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
            echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-tools.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/parents-android-cmdline"
            mv "$RUNNER_TEMP/parents-android-cmdline/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          if [[ "$SDK" == "$RUNNER_TEMP/parents-android-sdk" ]]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
            "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi
          echo "Android SDK ready at $SDK"
      - name: Install dependencies
        run: npm ci
      - name: Apply parents PWA icon if uploaded
        run: node scripts/apply-parents-icon.mjs web
      - name: Build parent-only assets
        run: npm run build:parent
      - name: Generate isolated Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply parents Android launcher icons if uploaded
        run: node scripts/apply-parents-icon.mjs android
      - name: Match native parent WebView typography to main app
        run: node scripts/patch-parents-android.mjs
      - name: Use school portrait on white native Android launch screen
        run: node scripts/patch-parents-native-splash.mjs
      - name: Verify Android identity and disabled OTA
        run: |
          grep -q 'app.hamzawasl.parents' android/app/build.gradle
          grep -q "enabled: audience === 'combined' ||" capacitor.config.ts
          test "${PARENT_OTA_ENABLED}" = 'true'
          test "${VITE_PARENT_OTA_ENABLED}" = 'true'
          grep -q 'parents-updates' src/utils/liveUpdate.ts
      - name: Build debug APK (testing only)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK package identity
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -q "package: name='app.hamzawasl.parents'"
          sha256sum "$APK" | tee parents-debug-sha256.txt
      - name: Upload test APK (not a release)
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: parents-preview-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            parents-debug-sha256.txt
          if-no-files-found: error
          retention-days: 7
      - name: Link verified test artifact
        env:
          ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
        run: |
          {
            echo '### همزة وصل – نسخة الأولياء Android (اختبار فقط)'
            echo ''
            echo 'Package: `app.hamzawasl.parents`'
            echo ''
            echo "Debug APK and SHA-256: [GitHub Actions artifact](${ARTIFACT_URL})"
            echo ''
            echo 'نسخة اختبارية فقط؛ تحديثات الويب تأتي حصرياً من parents-updates بعد نشر يدوي معتمد.'
          } >> "$GITHUB_STEP_SUMMARY"

# OTA checks are enabled ONLY for standalone parents test APKs.
# The parents-updates feed remains 0.0.0 until an explicitly authorized manual publication.
# No production deployment; native feature updates still require a new APK.
