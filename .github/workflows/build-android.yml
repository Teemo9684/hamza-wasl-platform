name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notify_email:
        description: 'البريد الإلكتروني للإشعار'
        required: false
        type: string

env:
  NOTIFY_EMAIL: ${{ inputs.notify_email || vars.APK_NOTIFY_EMAIL }}
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://caeltaubipulyrdyqsjn.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        id: upload-apk
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Send Email Notification
        if: env.NOTIFY_EMAIL != ''
        run: |
          ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_MSG="${{ github.event.head_commit.message || 'تشغيل يدوي' }}"
          
          curl -X POST "${{ env.SUPABASE_URL }}/functions/v1/notify-apk-ready" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ env.SUPABASE_ANON_KEY }}" \
            -d "{
              \"email\": \"${{ env.NOTIFY_EMAIL }}\",
              \"downloadUrl\": \"${ARTIFACT_URL}\",
              \"buildNumber\": \"${{ github.run_number }}\",
              \"commitMessage\": \"${COMMIT_MSG}\"
            }"
          
          echo "✅ Email notification sent to ${{ env.NOTIFY_EMAIL }}"
