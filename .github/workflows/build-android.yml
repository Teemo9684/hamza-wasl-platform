name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notify_email:
        description: 'البريد الإلكتروني للإشعار'
        required: false
        type: string
      app_version:
        description: 'رقم إصدار التطبيق'
        required: false
        type: string
        default: '1.0.0'

env:
  NOTIFY_EMAIL: ${{ inputs.notify_email || vars.APK_NOTIFY_EMAIL }}
  APP_VERSION: ${{ inputs.app_version || '1.0.0' }}
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://caeltaubipulyrdyqsjn.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Update version in capacitor.config.ts
        run: |
          sed -i "s/version: '.*'/version: '${{ env.APP_VERSION }}'/" capacitor.config.ts || true

      - name: Setup Android platform
        run: |
          if [ -d "android" ] && [ ! -f "android/build.gradle" ]; then
            rm -rf android
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Fix WebView Display Size and System Bars
        run: |
          TARGET_DIR="android/app/src/main/java/com/hamzawasl/app"
          mkdir -p "$TARGET_DIR"
          cp android-config/MainActivity.java "$TARGET_DIR/MainActivity.java"
          
          if grep -q "WindowInsetsControllerCompat" "$TARGET_DIR/MainActivity.java"; then
            echo "✅ MainActivity.java copied with modern WindowInsetsControllerCompat"
          else
            echo "❌ Error: Modern WindowInsetsControllerCompat not found"
            cat "$TARGET_DIR/MainActivity.java"
            exit 1
          fi

      - name: Configure System Bars Theme
        run: |
          STYLES_FILE="android/app/src/main/res/values/styles.xml"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">' '        <item name="android:colorPrimary">#1e40af</item>' '        <item name="android:colorPrimaryDark">#1e3a8a</item>' '        <item name="android:colorAccent">#3b82f6</item>' '        <item name="android:statusBarColor">#1e40af</item>' '        <item name="android:navigationBarColor">#000000</item>' '        <item name="android:windowBackground">#F5F7FA</item>' '        <item name="android:windowLightStatusBar">false</item>' '        <item name="android:windowDrawsSystemBarBackgrounds">true</item>' '        <item name="android:fitsSystemWindows">true</item>' '        <item name="android:windowFullscreen">false</item>' '        <item name="android:windowTranslucentStatus">false</item>' '        <item name="android:windowTranslucentNavigation">false</item>' '    </style>' '    <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">' '        <item name="android:colorPrimary">#1e40af</item>' '        <item name="android:colorPrimaryDark">#1e3a8a</item>' '        <item name="android:colorAccent">#3b82f6</item>' '        <item name="android:statusBarColor">#1e40af</item>' '        <item name="android:navigationBarColor">#000000</item>' '        <item name="android:windowBackground">#F5F7FA</item>' '        <item name="android:windowLightStatusBar">false</item>' '        <item name="android:windowDrawsSystemBarBackgrounds">true</item>' '        <item name="android:fitsSystemWindows">true</item>' '        <item name="android:windowFullscreen">false</item>' '        <item name="android:windowTranslucentStatus">false</item>' '        <item name="android:windowTranslucentNavigation">false</item>' '    </style>' '    <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">' '        <item name="android:background">#1e40af</item>' '    </style>' '</resources>' > "$STYLES_FILE"
          echo "✅ styles.xml updated with solid system bar colors"

      - name: Configure System Bars Theme v27
        run: |
          mkdir -p "android/app/src/main/res/values-v27"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">' '        <item name="android:colorPrimary">#1e40af</item>' '        <item name="android:colorPrimaryDark">#1e3a8a</item>' '        <item name="android:colorAccent">#3b82f6</item>' '        <item name="android:statusBarColor">#1e40af</item>' '        <item name="android:navigationBarColor">#000000</item>' '        <item name="android:windowBackground">#F5F7FA</item>' '        <item name="android:windowLightStatusBar">false</item>' '        <item name="android:windowLightNavigationBar">false</item>' '        <item name="android:windowDrawsSystemBarBackgrounds">true</item>' '        <item name="android:fitsSystemWindows">true</item>' '        <item name="android:windowFullscreen">false</item>' '        <item name="android:windowTranslucentStatus">false</item>' '        <item name="android:windowTranslucentNavigation">false</item>' '    </style>' '    <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">' '        <item name="android:colorPrimary">#1e40af</item>' '        <item name="android:colorPrimaryDark">#1e3a8a</item>' '        <item name="android:colorAccent">#3b82f6</item>' '        <item name="android:statusBarColor">#1e40af</item>' '        <item name="android:navigationBarColor">#000000</item>' '        <item name="android:windowBackground">#F5F7FA</item>' '        <item name="android:windowLightStatusBar">false</item>' '        <item name="android:windowLightNavigationBar">false</item>' '        <item name="android:windowDrawsSystemBarBackgrounds">true</item>' '        <item name="android:fitsSystemWindows">true</item>' '        <item name="android:windowFullscreen">false</item>' '        <item name="android:windowTranslucentStatus">false</item>' '        <item name="android:windowTranslucentNavigation">false</item>' '    </style>' '    <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">' '        <item name="android:background">#1e40af</item>' '    </style>' '</resources>' > "android/app/src/main/res/values-v27/styles.xml"
          echo "✅ values-v27/styles.xml created"

      - name: Configure System Bars Theme v35
        run: |
          mkdir -p "android/app/src/main/res/values-v35"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">' '        <item name="android:colorPrimary">#1e40af</item>' '        <item name="android:colorPrimaryDark">#1e3a8a</item>' '        <item name="android:colorAccent">#3b82f6</item>' '        <item name="android:statusBarColor">#1e40af</item>' '        <item name="android:navigationBarColor">#000000</item>' '        <item name="android:windowBackground">#F5F7FA</item>' '        <item name="android:windowLightStatusBar">false</item>' '        <item name="android:windowLightNavigationBar">false</item>' '        <item name="android:windowDrawsSystemBarBackgrounds">true</item>' '        <item name="android:fitsSystemWindows">true</item>' '        <item name="android:windowFullscreen">false</item>' '        <item name="android:windowTranslucentStatus">false</item>' '        <item name="android:windowTranslucentNavigation">false</item>' '        <item name="android:enforceStatusBarContrast">false</item>' '        <item name="android:enforceNavigationBarContrast">false</item>' '        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>' '    </style>' '    <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">' '        <item name="android:colorPrimary">#1e40af</item>' '        <item name="android:colorPrimaryDark">#1e3a8a</item>' '        <item name="android:colorAccent">#3b82f6</item>' '        <item name="android:statusBarColor">#1e40af</item>' '        <item name="android:navigationBarColor">#000000</item>' '        <item name="android:windowBackground">#F5F7FA</item>' '        <item name="android:windowLightStatusBar">false</item>' '        <item name="android:windowLightNavigationBar">false</item>' '        <item name="android:windowDrawsSystemBarBackgrounds">true</item>' '        <item name="android:fitsSystemWindows">true</item>' '        <item name="android:windowFullscreen">false</item>' '        <item name="android:windowTranslucentStatus">false</item>' '        <item name="android:windowTranslucentNavigation">false</item>' '        <item name="android:enforceStatusBarContrast">false</item>' '        <item name="android:enforceNavigationBarContrast">false</item>' '        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>' '    </style>' '    <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">' '        <item name="android:background">#1e40af</item>' '    </style>' '</resources>' > "android/app/src/main/res/values-v35/styles.xml"
          echo "✅ values-v35/styles.xml created"

      - name: Setup Firebase for Push Notifications
        run: |
          ANDROID_APP_DIR="android/app"
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > "$ANDROID_APP_DIR/google-services.json"
            echo "✅ google-services.json configured"
          else
            echo "⚠️ GOOGLE_SERVICES_JSON secret not set - Push notifications will not work"
          fi

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Setup Custom App Icons
        run: |
          declare -A sizes=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )
          
          RES_DIR="android/app/src/main/res"
          SOURCE_ICON="public/icon-512.png"
          
          if [ -f "$SOURCE_ICON" ]; then
            for folder in "${!sizes[@]}"; do
              size=${sizes[$folder]}
              mkdir -p "$RES_DIR/$folder"
              icon_size=$((size * 72 / 100))
              convert -size ${size}x${size} xc:transparent \
                \( "$SOURCE_ICON" -resize ${icon_size}x${icon_size} \) \
                -gravity center -composite \
                "$RES_DIR/$folder/ic_launcher.png"
              convert -size ${size}x${size} xc:transparent \
                \( "$SOURCE_ICON" -resize ${icon_size}x${icon_size} \) \
                -gravity center -composite \
                "$RES_DIR/$folder/ic_launcher_round.png"
              fg_size=$((size * 61 / 100))
              convert -size ${size}x${size} xc:transparent \
                \( "$SOURCE_ICON" -resize ${fg_size}x${fg_size} \) \
                -gravity center -composite \
                "$RES_DIR/$folder/ic_launcher_foreground.png"
              echo "✅ Created ${size}x${size} icons in $folder"
            done
          else
            echo "⚠️ Source icon not found at $SOURCE_ICON"
          fi

      - name: Setup Splash Screen
        run: |
          RES_DIR="android/app/src/main/res"
          SOURCE_SPLASH="src/assets/splash-logo.png"
          
          declare -A splash_sizes=(
            ["drawable-mdpi"]="320x480"
            ["drawable-hdpi"]="480x800"
            ["drawable-xhdpi"]="720x1280"
            ["drawable-xxhdpi"]="960x1600"
            ["drawable-xxxhdpi"]="1280x1920"
          )
          
          if [ -f "$SOURCE_SPLASH" ]; then
            for folder in "${!splash_sizes[@]}"; do
              dims=${splash_sizes[$folder]}
              mkdir -p "$RES_DIR/$folder"
              convert -size $dims xc:"#1a1a2e" \
                \( "$SOURCE_SPLASH" -resize 40% \) \
                -gravity center -composite \
                "$RES_DIR/$folder/splash.png"
              echo "✅ Created splash screen in $folder ($dims)"
            done
            
            mkdir -p "$RES_DIR/drawable"
            convert -size 1280x1920 xc:"#1a1a2e" \
              \( "$SOURCE_SPLASH" -resize 40% \) \
              -gravity center -composite \
              "$RES_DIR/drawable/splash.png"
            echo "✅ Created fallback splash screen"
          else
            echo "⚠️ Source splash not found at $SOURCE_SPLASH, using icon instead"
            SOURCE_ICON="public/icon-512.png"
            if [ -f "$SOURCE_ICON" ]; then
              for folder in "${!splash_sizes[@]}"; do
                dims=${splash_sizes[$folder]}
                mkdir -p "$RES_DIR/$folder"
                convert -size $dims xc:"#1a1a2e" \
                  \( "$SOURCE_ICON" -resize 30% \) \
                  -gravity center -composite \
                  "$RES_DIR/$folder/splash.png"
              done
              mkdir -p "$RES_DIR/drawable"
              convert -size 1280x1920 xc:"#1a1a2e" \
                \( "$SOURCE_ICON" -resize 30% \) \
                -gravity center -composite \
                "$RES_DIR/drawable/splash.png"
            fi
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        id: upload-apk
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Send Email Notification
        if: env.NOTIFY_EMAIL != ''
        run: |
          ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_MSG="${{ github.event.head_commit.message || 'تشغيل يدوي' }}"
          
          curl -X POST "${{ env.VITE_SUPABASE_URL }}/functions/v1/notify-apk-ready" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -d "{
              \"email\": \"${{ env.NOTIFY_EMAIL }}\",
              \"downloadUrl\": \"${ARTIFACT_URL}\",
              \"buildNumber\": \"${{ github.run_number }}\",
              \"commitMessage\": \"${COMMIT_MSG}\"
            }"
          
          echo "✅ Email notification sent to ${{ env.NOTIFY_EMAIL }}"
